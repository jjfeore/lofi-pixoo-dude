# Stored GIFs are also the default in bridge.example.toml and when transport is omitted.
version = 1
pack = "../pets/decker/revisions/delegation-v3/review"
pipe = '\\.\pipe\pixoo-pet'
dry_run = false
notification_forward = []

[device]
address = "192.168.1.123" # set the Pixoo's address
# local_token = 123456
transport = "stored-gif"
max_frames = 40
timeout_ms = 3000
switch_interval_ms = 0
playback_start_delay_ms = 0

[device.storage]
# Paths are relative to this config. Save receipts are private device metadata.
cache_dir = "../local/stored-gifs"
directory = "codex-pet/decker"
bind = "0.0.0.0:8787"
# Auto-detected from the route to the Pixoo. Override for another host interface.
# public_base_url = "http://192.168.1.18:8787"
download_timeout_ms = 15000
settle_ms = 500

[animations]
# Empty strings disable a state; names otherwise default to the logical state.
