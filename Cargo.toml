[package]
name = "pixoo-pet"
version = "0.1.0"
edition = "2024"
description = "A small local Codex lifecycle bridge for Divoom Pixoo64 pets"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros", "signal"] }
toml = "0.9"
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
gif = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
